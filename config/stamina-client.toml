
[stamina]
	#Maximum stamina.
	#Range: 1 ~ 10000
	max_stamina = 100
	#Stamina drained per tick while sprinting and actually moving on the ground (20 ticks = 1 second).
	#Range: 0.0 ~ 100.0
	sprint_drain_per_tick = 0.5
	#Stamina cost of a single jump.
	#Range: 0.0 ~ 10000.0
	jump_cost = 15.0
	#Stamina regenerated per tick once regen is active (see regen_delay_ticks).
	#Range: 0.0 ~ 100.0
	regen_per_tick = 0.4
	#Ticks of 'recovery lag' after you stop draining stamina (stop sprinting, or jump) before regen starts (20 = 1 second).
	#Range: 0 ~ 600
	regen_delay_ticks = 20

[hud]
	#HUD bar horizontal offset in pixels from screen center. Set by dragging the bar in the editor screen (default keybind: see controls).
	#Range: -4000 ~ 4000
	bar_offset_x = 0
	#HUD bar vertical offset in pixels from the bottom of the screen (larger = higher up).
	#Range: -4000 ~ 4000
	bar_offset_y = 52

