
#TacZ Additions - Client Config
[client]
	#If false, disables all gun movement (sway, roll, etc).
	enableGunMovement = true
	#If false, disables sway/roll from strafing movement.
	enableStrafeMovement = true
	#Drag smoothing factor (lower = more inertia).
	#Range: 0.0 ~ 1.0
	dragSmoothing = 0.1
	#Decay factor for motion smoothing.
	#Range: 0.0 ~ 1.0
	decayFactor = 0.5
	#Velocity influence on final position.
	#Range: 0.0 ~ 1.0
	momentumFactor = 0.45
	#Roll rotation sensitivity. Negative values invert the movement.
	#Range: -10.0 ~ 10.0
	rollSensitivity = 1.2
	#Maximum roll angle (degrees).
	#Range: 0.0 ~ 180.0
	maxTiltAngle = 20.0

	[client.variableZoom]
		#How much of a scope's zoom range one scroll notch covers.
		#0.125 means roughly eight notches to sweep from the lowest to the highest magnification.
		#Range: 0.01 ~ 1.0
		scrollSensitivity = 0.125
		#If true, scrolling down zooms in instead of out.
		invertScroll = false
		#How quickly the magnification catches up to where you scrolled, per tick.
		#1.0 snaps instantly. Lower values ease in more gradually.
		#Range: 0.05 ~ 1.0
		smoothingSpeed = 0.35
		#How close to one of the scope's own zoom levels the detent grabs, as a fraction of the range.
		#Larger values make the levels feel wider.
		#Range: 0.0 ~ 0.5
		detentSnapRange = 0.04
		#How much extra scrolling it takes to leave a zoom level, as a fraction of the range.
		#This is the small lock felt at each level. 0.0 removes the detents entirely.
		#Range: 0.0 ~ 1.0
		detentBreakout = 0.1

		[client.variableZoom.handReach]
			#If true, the off hand reaches up to the optic while you scroll the magnification.
			enabled = true
			#How long the hand stays at the optic after the last scroll notch, in seconds.
			#Range: 0.0 ~ 5.0
			holdSeconds = 0.45
			#How briskly the hand travels. Higher values arrive sooner.
			#Range: 1.0 ~ 60.0
			speed = 12.0
			#How much the travel is damped. 1.0 settles without overshooting,
			#lower values let the hand overshoot slightly before it settles.
			#Range: 0.1 ~ 2.0
			damping = 0.8
			#How far the hand travels to reach the optic, in model pixels (1/16 of a block).
			#X is sideways travel. Zero keeps the hand on its own line up the gun, which is
			#normally right, since the support hand already sits under the optic.
			#Range: -32.0 ~ 32.0
			offsetX = 0.0
			#Y is vertical, positive is up. The arm is anchored around its middle, so this sits
			#below the optic to bring the top of the arm up against it rather than its centre.
			#Range: -32.0 ~ 32.0
			offsetY = -6.0
			#Z runs along the gun, positive is back toward you where the magnification ring sits.
			#This adds to the travel the two bones already imply, which is itself backwards.
			#Range: -32.0 ~ 32.0
			offsetZ = 10.0
			#How far the arm is turned once it arrives, in degrees, pivoting about the hand.
			#X pitches the far end of the arm up and down.
			#Range: -180.0 ~ 180.0
			twistX = 0.0
			#Y swings the far end of the arm sideways. The elbow sits back and to your left,
			#so negative carries it away from the gun and positive drives it into the centre.
			#Range: -180.0 ~ 180.0
			twistY = -25.0
			#Z rolls the arm about its own length.
			#Range: -180.0 ~ 180.0
			twistZ = 0.0

	[client.hipfire]
		#Yaw multiplier when hip-firing. Negative values invert the movement.
		#Range: -10.0 ~ 10.0
		yawMultiplier = 1.25
		#Pitch multiplier when hip-firing. Negative values invert the movement.
		#Range: -10.0 ~ 10.0
		pitchMultiplier = 1.2
		#Roll factor when hip-firing. Negative values invert the movement.
		#Range: -10.0 ~ 10.0
		rollFactor = 1.75
		#Maximum pitch offset when hip-firing (degrees)
		#Range: 0.0 ~ 45.0
		maxHipPitch = 6.0
		#Maximum yaw offset when hip-firing (degrees)
		#Range: 0.0 ~ 45.0
		maxHipYaw = 12.0

	[client.aim]
		#Yaw multiplier when aiming. Negative values invert the movement.
		#Range: -10.0 ~ 10.0
		yawMultiplier = 0.6
		#Roll factor when aiming. Negative values invert the movement.
		#Range: -10.0 ~ 10.0
		rollFactor = 2.75
		#Maximum pitch offset when aiming (degrees)
		#Range: 0.0 ~ 45.0
		maxAimPitch = 2.0
		#Maximum yaw offset when aiming (degrees)
		#Range: 0.0 ~ 45.0
		maxAimYaw = 10.0

	[client.strafe]
		#Yaw sway from strafing while hip-firing. Negative values invert the movement.
		#Range: -40.0 ~ 40.0
		hipfireYawMultiplier = 0.0
		#Roll tilt from strafing while hip-firing. Negative values invert the movement.
		#Range: -40.0 ~ 40.0
		hipfireRollMultiplier = 20.0
		#Yaw sway from strafing while aiming. Negative values invert the movement.
		#Range: -40.0 ~ 40.0
		aimingYawMultiplier = 0.0
		#Roll tilt from strafing while aiming. Negative values invert the movement.
		#Range: -40.0 ~ 40.0
		aimingRollMultiplier = 20.0
		#Maximum yaw offset from strafing (degrees)
		#Range: 0.0 ~ 20.0
		maxStrafeYaw = 6.0
		#Maximum roll angle from strafing (degrees)
		#Range: 0.0 ~ 40.0
		maxStrafeRoll = 20.0
		#Smoothing factor for strafe movement (higher = more responsive, lower = smoother)
		#Range: 0.01 ~ 1.0
		strafeSmoothing = 0.15

	[client.recoil]
		#Visual recoil X multiplier (left-right shake)
		#Range: -10.0 ~ 10.0
		visualX = 0.0
		#Visual recoil Y multiplier (vertical bounce). Negative values invert the movement.
		#Range: -10.0 ~ 10.0
		visualY = 0.0
		#Visual recoil Z multiplier (kickback). Negative values invert the movement.
		#Range: -20.0 ~ 20.0
		visualZ = 5.0
		#Visual recoil kick angle in degrees (negative rotates downward, 0 = disabled)
		#Range: -45.0 ~ 45.0
		kickAngle = 1.0
		#Pivot point offset along Z axis for barrel kick rotation (distance from grip)
		#Range: -2.0 ~ 2.0
		kickPivot = 0.0

[pipScope]
	#How a magnified optic shows its image.
	#OFF narrows the whole screen FOV, which is what TaCZ does on its own.
	#FAKE crops the frame that was already drawn into the lens, which is cheap but only as
	#sharp as the screen it was sampled from.
	#REAL draws the world a second time through the scope for true magnification, at the
	#cost of a second world pass.
	#A server can withhold this entirely, in which case OFF is used regardless.
	#Allowed Values: OFF, FAKE, REAL
	mode = "OFF"
	#REAL only. Resolution the second pass is kept at, relative to the screen.
	#This is the sharpness of the lens image, not the cost of drawing it: the pass itself
	#always runs at screen resolution and is only scaled on the way into its own texture.
	#Below 1.0 the lens is visibly soft and shimmers as you turn.
	#Range: 0.25 ~ 2.0
	realResolutionScale = 1.0
	#REAL only. Magnification below which the cheap cropped image stands in for the second
	#pass, which is the one setting here that actually removes work.
	#A variable optic spends much of its life near the bottom of its range, so raising this
	#to 2 or 3 skips the second world render most of the time. The cost is a visible step in
	#sharpness as a scroll sweep crosses the value, which is why it defaults to off.
	#1.0 always runs the second pass.
	#Range: 1.0 ~ 50.0
	realMinMagnification = 1.0
	#REAL only. Draw the second pass every frame.
	#If false, a still camera reuses the previous pass on alternate frames, which halves the
	#cost but leaves the lens a frame behind whenever anything in it moves.
	realRefreshEveryFrame = true

[experimental]
	#If true, shows floating magazine ammo text (experimental).
	magazineText = false
	#If true, renders laser dot particles when using laser attachments
	enableLaserDot = true

